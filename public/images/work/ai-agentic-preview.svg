  <rect x="20" y="370" width="140" height="32" rx="16" fill="#111"/>
  <rect x="168" y="370" width="140" height="32" rx="16" fill="none" stroke="#e0e0db" stroke-width="1.5"/>

  <!-- Main content area -->
  <rect x="400" y="20" width="780" height="40" rx="8" fill="#fff" stroke="#e0e0db" stroke-width="1"/>
