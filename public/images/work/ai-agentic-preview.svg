  <rect x="420" y="150" width="80" height="40" rx="8" fill="#f5f5f0"/>
  <rect x="516" y="150" width="80" height="40" rx="8" fill="#f5f5f0"/>
  <rect x="612" y="150" width="80" height="40" rx="8" fill="#f5f5f0"/>
  <!-- Trust indicator bar -->
  <rect x="420" y="210" width="320" height="8" rx="4" fill="#e0e0db"/>
  <rect x="420" y="210" width="210" height="8" rx="4" fill="#111"/>
  <rect x="420" y="225" width="80" height="6" rx="3" fill="#bbb"/>

  <rect x="790" y="80" width="370" height="200" rx="12" fill="#fff" stroke="#e0e0db" stroke-width="1"/>
