  <rect x="810" y="175" width="260" height="7" rx="3" fill="#f0f0eb"/>

  <rect x="400" y="300" width="760" height="120" rx="12" fill="#fff" stroke="#e0e0db" stroke-width="1"/>
  <rect x="420" y="318" width="140" height="10" rx="5" fill="#222"/>
  <rect x="420" y="340" width="680" height="7" rx="3" fill="#e0e0db"/>
