<svg viewBox="0 0 1700 620" xmlns="http://www.w3.org/2000/svg" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5fb8a8"/>
      <stop offset="50%" stop-color="#5a9fd6"/>
      <stop offset="100%" stop-color="#8a7fd1"/>
    </linearGradient>
    <clipPath id="clipAll"><rect x="0" y="0" width="1700" height="620" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clipAll)">
    <!-- ===== section backgrounds ===== -->
    <rect x="0" y="0" width="566" height="620" fill="#eef3fb"/>
    <rect x="566" y="0" width="568" height="620" fill="#eef7f3"/>
    <rect x="1134" y="0" width="566" height="620" fill="#f4f0fb"/>

    <!-- soft background blobs, each section -->
    <circle cx="90" cy="520" r="160" fill="#dde7f8" opacity="0.6"/>
    <circle cx="500" cy="60" r="120" fill="#e3ecfa" opacity="0.5"/>

    <rect x="610" y="420" width="70" height="140" rx="10" fill="#d8ece3" opacity="0.7"/>
    <rect x="700" y="380" width="60" height="180" rx="10" fill="#cfe6da" opacity="0.6"/>
    <rect x="1020" y="400" width="70" height="160" rx="10" fill="#d8ece3" opacity="0.7"/>
    <circle cx="950" cy="80" r="110" fill="#e1f0e8" opacity="0.5"/>

    <circle cx="1620" cy="80" r="140" fill="#e7def7" opacity="0.5"/>
    <circle cx="1180" cy="540" r="130" fill="#ece3f9" opacity="0.6"/>

    <!-- section micro-labels -->
    <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#8a8f9c">
      <text x="40" y="44">FLOWS</text>
      <text x="606" y="44">JOURNEYS</text>
      <text x="1174" y="44">AI PLAYBOOKS</text>
    </g>

    <!-- divider arrows -->
    <g stroke="#b9c0cc" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M548 310 h34 M572 296 l14 14 l-14 14"/>
      <path d="M1116 310 h34 M1140 296 l14 14 l-14 14"/>
    </g>

    <!-- ============ SECTION 1: FLOWS ============ -->
    <g>
      <!-- person, reaching toward the flow diagram -->
      <g transform="translate(60,330)">
        <rect x="-10" y="70" width="150" height="130" rx="24" fill="#3b63c9"/>
        <circle cx="35" cy="40" r="42" fill="#2d4ea3"/>
        <rect x="70" y="95" width="100" height="26" rx="13" fill="#3b63c9" transform="rotate(-18 70 95)"/>
        <circle cx="168" cy="55" r="13" fill="#2d4ea3"/>
      </g>

      <!-- flow diagram -->
      <g font-size="15" font-weight="600" fill="#2b2f38">
        <!-- connectors -->
        <g stroke="#c7ccd6" stroke-width="2" fill="none">
          <path d="M240 190 h40"/>
          <path d="M296 190 v-40 h40 M296 190 v40 h40"/>
          <path d="M470 150 h30 v0"/>
          <path d="M470 230 v70 h30 M470 230 v0 M470 230 h30 M470 230 v0"/>
        </g>
        <g stroke="#c7ccd6" stroke-width="2" fill="none">
          <path d="M470 230 h0"/>
        </g>

        <!-- trigger -->
        <g transform="translate(150,165)">
          <rect width="90" height="50" rx="14" fill="#ffffff" stroke="#e3e6ec"/>
          <circle cx="26" cy="25" r="13" fill="#2fae79"/>
          <path d="M22 19 l9 6 l-9 6 Z" fill="#ffffff"/>
          <text x="50" y="30">Trigger</text>
        </g>

        <circle cx="296" cy="190" r="9" fill="#ffffff" stroke="#c7ccd6" stroke-width="2"/>
        <path d="M291 190 h10 M296 185 v10" stroke="#9aa1ad" stroke-width="2"/>

        <!-- collect info -->
        <g transform="translate(336,140)">
          <rect width="150" height="50" rx="14" fill="#ffffff" stroke="#e3e6ec"/>
          <rect x="12" y="12" width="26" height="26" rx="8" fill="#3b63c9"/>
          <circle cx="25" cy="21" r="5" fill="#fff"/>
          <path d="M16 32 q9 -9 18 0" stroke="#fff" stroke-width="2.4" fill="none"/>
          <text x="50" y="30" font-size="13">Collect info</text>
        </g>

        <!-- approval -->
        <g transform="translate(336,210)">
          <rect width="150" height="50" rx="14" fill="#ffffff" stroke="#e3e6ec"/>
          <rect x="12" y="12" width="26" height="26" rx="8" fill="#7a5fd0"/>
          <rect x="19" y="19" width="12" height="4" fill="#fff"/>
          <rect x="19" y="25" width="12" height="4" fill="#fff"/>
          <text x="50" y="30" font-size="13">Approval</text>
        </g>

        <circle cx="470" cy="260" r="9" fill="#ffffff" stroke="#c7ccd6" stroke-width="2"/>
        <path d="M465 260 h10 M470 255 v10" stroke="#9aa1ad" stroke-width="2"/>

        <g stroke="#c7ccd6" stroke-width="2" fill="none">
          <path d="M486 260 h30 M516 260 v-65 h20 M516 260 v0 h20 M516 260 v65 h20"/>
        </g>

        <!-- condition -->
        <g transform="translate(536,160)">
          <rect width="150" height="46" rx="14" fill="#ffffff" stroke="#e3e6ec"/>
          <rect x="13" y="11" width="22" height="22" rx="5" fill="#e3a93b" transform="rotate(45 24 22)"/>
          <text x="48" y="28" font-size="13">Condition</text>
        </g>
        <!-- notify -->
        <g transform="translate(536,226)">
          <rect width="150" height="46" rx="14" fill="#ffffff" stroke="#e3e6ec"/>
          <circle cx="24" cy="22" r="13" fill="#df5a5a"/>
          <path d="M24 15 a7 7 0 0 1 7 7 v5 l3 3 h-20 l3 -3 v-5 a7 7 0 0 1 7 -7 Z" fill="#fff" transform="scale(0.72) translate(9,8)"/>
          <text x="48" y="28" font-size="13">Notify</text>
        </g>
        <!-- complete -->
        <g transform="translate(536,292)">
          <rect width="150" height="46" rx="14" fill="#ffffff" stroke="#e3e6ec"/>
          <circle cx="24" cy="22" r="13" fill="#2fae79"/>
          <path d="M18 22 l4 5 l9 -10" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="48" y="28" font-size="13">Complete</text>
        </g>
      </g>
    </g>

    <!-- ============ SECTION 2: JOURNEYS ============ -->
    <g>
      <!-- winding path -->
      <path d="M660 460 C 740 380, 700 300, 790 260 S 940 300, 960 220 S 1080 180, 1090 140"
            fill="none" stroke="url(#pathGrad)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
      <circle cx="790" cy="260" r="8" fill="#5fb8a8"/>
      <circle cx="960" cy="220" r="8" fill="#5a9fd6"/>
      <circle cx="1030" cy="170" r="8" fill="#8a7fd1"/>

      <!-- walking person with phone -->
      <g transform="translate(830,330)">
        <rect x="-20" y="80" width="140" height="150" rx="32" fill="#e3a93b"/>
        <circle cx="50" cy="42" r="46" fill="#2b2f38"/>
        <rect x="88" y="120" width="54" height="30" rx="10" fill="#fff" stroke="#e3e6ec" stroke-width="2"/>
        <rect x="95" y="127" width="18" height="4" rx="2" fill="#c7ccd6"/>
        <rect x="95" y="134" width="30" height="4" rx="2" fill="#c7ccd6"/>
      </g>

      <!-- surrounding UI cards -->
      <g font-size="13" font-weight="600" fill="#2b2f38">
        <!-- Onboard -->
        <g transform="translate(630,140)">
          <rect width="140" height="52" rx="14" fill="#ffffff" stroke="#e3e6ec"/>
          <rect x="12" y="13" width="26" height="26" rx="8" fill="#2fae79"/>
          <circle cx="25" cy="22" r="5" fill="#fff"/>
          <path d="M16 33 q9 -9 18 0" stroke="#fff" stroke-width="2.4" fill="none"/>
          <text x="48" y="24">Onboard</text>
          <rect x="48" y="30" width="60" height="4" rx="2" fill="#e3e6ec"/>
        </g>
        <!-- Get Ready -->
        <g transform="translate(980,120)">
          <rect width="150" height="52" rx="14" fill="#ffffff" stroke="#e3e6ec"/>
          <rect x="12" y="13" width="26" height="26" rx="8" fill="#3b63c9"/>
          <rect x="18" y="19" width="14" height="10" rx="2" fill="#fff"/>
          <text x="48" y="24">Get ready</text>
          <rect x="48" y="30" width="70" height="4" rx="2" fill="#e3e6ec"/>
        </g>
        <!-- Learn -->
        <g transform="translate(1080,220)">
          <rect width="130" height="52" rx="14" fill="#ffffff" stroke="#e3e6ec"/>
          <rect x="12" y="13" width="26" height="26" rx="8" fill="#e3a93b"/>
          <rect x="18" y="19" width="14" height="14" rx="2" fill="#fff"/>
          <text x="48" y="24">Learn</text>
          <rect x="48" y="30" width="55" height="4" rx="2" fill="#e3e6ec"/>
        </g>
        <!-- Get Benefits -->
        <g transform="translate(1000,340)">
          <rect width="150" height="52" rx="14" fill="#ffffff" stroke="#e3e6ec"/>
          <rect x="12" y="13" width="26" height="26" rx="8" fill="#df5a5a"/>
          <path d="M25 20 c-4 -6 -13 -2 -13 5 c0 7 13 13 13 13 s13 -6 13 -13 c0 -7 -9 -11 -13 -5Z" fill="#fff" transform="translate(0,0) scale(0.55) translate(23,18)"/>
          <text x="48" y="24">Benefits</text>
          <rect x="48" y="30" width="68" height="4" rx="2" fill="#e3e6ec"/>
        </g>
        <!-- Grow -->
        <g transform="translate(870,420)">
          <rect width="120" height="52" rx="14" fill="#ffffff" stroke="#e3e6ec"/>
          <rect x="12" y="13" width="26" height="26" rx="8" fill="#3b63c9"/>
          <rect x="18" y="26" width="4" height="8" fill="#fff"/>
          <rect x="24" y="22" width="4" height="12" fill="#fff"/>
          <rect x="30" y="18" width="4" height="16" fill="#fff"/>
          <text x="48" y="24">Grow</text>
          <rect x="48" y="30" width="48" height="4" rx="2" fill="#e3e6ec"/>
        </g>
        <!-- Stay engaged -->
        <g transform="translate(645,420)">
          <rect width="160" height="52" rx="14" fill="#ffffff" stroke="#e3e6ec"/>
          <rect x="12" y="13" width="26" height="26" rx="8" fill="#7a5fd0"/>
          <circle cx="21" cy="21" r="5" fill="#fff"/>
          <circle cx="31" cy="21" r="5" fill="#fff" opacity="0.7"/>
          <text x="48" y="24">Stay engaged</text>
          <rect x="48" y="30" width="78" height="4" rx="2" fill="#e3e6ec"/>
        </g>
      </g>
    </g>

    <!-- ============ SECTION 3: AI PLAYBOOKS ============ -->
    <g>
      <!-- sparkles -->
      <g fill="#8a7fd1" opacity="0.8">
        <path d="M1560 70 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 l14 -5 Z"/>
        <path d="M1660 190 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z" opacity="0.6"/>
      </g>

      <!-- radiating signal lines -->
      <g stroke="#c9bdf0" stroke-width="1.5" stroke-dasharray="3 5" fill="none">
        <path d="M1430 230 L1330 100"/>
        <path d="M1430 230 L1460 90"/>
        <path d="M1430 230 L1560 110"/>
        <path d="M1430 230 L1620 170"/>
        <path d="M1460 260 L1300 170"/>
        <path d="M1460 260 L1620 250"/>
      </g>

      <!-- signal pills -->
      <g font-size="12.5" font-weight="500" fill="#2b2f38">
        <g transform="translate(1250,70)">
          <rect width="150" height="42" rx="21" fill="#ffffff" stroke="#e3e6ec"/>
          <circle cx="21" cy="21" r="13" fill="#3b63c9"/>
          <circle cx="21" cy="17" r="4" fill="#fff"/>
          <path d="M14 27 q7 -7 14 0" stroke="#fff" stroke-width="2" fill="none"/>
          <text x="42" y="26">Role change</text>
        </g>
        <g transform="translate(1410,52)">
          <rect width="170" height="42" rx="21" fill="#ffffff" stroke="#e3e6ec"/>
          <circle cx="21" cy="21" r="13" fill="#2fae79"/>
          <rect x="15" y="22" width="4" height="7" fill="#fff"/>
          <rect x="21" y="18" width="4" height="11" fill="#fff"/>
          <rect x="27" y="14" width="4" height="15" fill="#fff"/>
          <text x="42" y="26">Performance signal</text>
        </g>
        <g transform="translate(1570,76)">
          <rect width="170" height="42" rx="21" fill="#ffffff" stroke="#e3e6ec"/>
          <circle cx="21" cy="21" r="13" fill="#df5a5a"/>
          <circle cx="21" cy="19" r="5" fill="#fff"/>
          <path d="M21 14 a7 7 0 0 1 0 14 c-3 -5 -5 -8 -5 -10 a5 5 0 0 1 5 -4Z" fill="#fff" opacity="0"/>
          <text x="42" y="26">Location change</text>
        </g>
        <g transform="translate(1300,150)">
          <rect width="170" height="42" rx="21" fill="#ffffff" stroke="#e3e6ec"/>
          <circle cx="21" cy="21" r="13" fill="#e3a93b"/>
          <rect x="14" y="15" width="14" height="13" rx="2" fill="#fff"/>
          <text x="42" y="26">Work anniversary</text>
        </g>
        <g transform="translate(1600,150)">
          <rect width="150" height="42" rx="21" fill="#ffffff" stroke="#e3e6ec"/>
          <circle cx="21" cy="21" r="13" fill="#3b9fd6"/>
          <path d="M14 24 l16 -8 l-4 9 l4 9 Z" fill="#fff"/>
          <text x="42" y="26">Time off</text>
        </g>
        <g transform="translate(1570,230)">
          <rect width="170" height="42" rx="21" fill="#ffffff" stroke="#e3e6ec"/>
          <circle cx="21" cy="21" r="13" fill="#4f5fb0"/>
          <rect x="13" y="16" width="16" height="11" rx="3" fill="#fff"/>
          <text x="42" y="26">Manager feedback</text>
        </g>
        <g transform="translate(1280,228)">
          <rect width="150" height="42" rx="21" fill="#ffffff" stroke="#e3e6ec"/>
          <circle cx="21" cy="21" r="13" fill="#7a5fd0"/>
          <circle cx="17" cy="19" r="4" fill="#fff"/>
          <circle cx="25" cy="19" r="4" fill="#fff" opacity="0.75"/>
          <text x="42" y="26">Org changes</text>
        </g>
      </g>

      <!-- avatar -->
      <g transform="translate(1430,230)">
        <circle r="46" fill="#ffffff" stroke="#c9bdf0" stroke-width="3"/>
        <circle r="36" fill="#7a5fd0"/>
        <circle cy="-6" r="13" fill="#e9e3fb"/>
        <path d="M-20 24 q20 -22 40 0 Z" fill="#e9e3fb"/>
        <circle cx="30" cy="30" r="14" fill="#2fae79" stroke="#fff" stroke-width="3"/>
        <path d="M24 30 l4 4 l8 -8" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- suggestion panel -->
      <g transform="translate(1340,330)">
        <rect width="330" height="220" rx="18" fill="#ffffff" stroke="#e3e6ec"/>
        <text x="20" y="36" font-size="15" font-weight="700" fill="#2b2f38">AI Playbook Suggestion</text>

        <g font-size="13" font-weight="500" fill="#2b2f38">
          <g transform="translate(20,54)">
            <rect width="290" height="36" rx="10" fill="#f6f3fc"/>
            <rect x="10" y="8" width="20" height="20" rx="6" fill="#2fae79"/>
            <text x="42" y="23">Onboarding Enablement</text>
            <path d="M268 18 l6 -6 M268 18 l6 6" stroke="#9aa1ad" stroke-width="1.6" fill="none"/>
          </g>
          <g transform="translate(20,98)">
            <rect width="290" height="36" rx="10" fill="#f6f3fc"/>
            <rect x="10" y="8" width="20" height="20" rx="6" fill="#7a5fd0"/>
            <text x="42" y="23">Learning Recommendations</text>
            <path d="M268 18 l6 -6 M268 18 l6 6" stroke="#9aa1ad" stroke-width="1.6" fill="none"/>
          </g>
          <g transform="translate(20,142)">
            <rect width="290" height="36" rx="10" fill="#f6f3fc"/>
            <rect x="10" y="8" width="20" height="20" rx="6" fill="#e3a93b"/>
            <text x="42" y="23">Benefits Enrollment</text>
            <path d="M268 18 l6 -6 M268 18 l6 6" stroke="#9aa1ad" stroke-width="1.6" fill="none"/>
          </g>
        </g>

        <rect x="20" y="186" width="178" height="18" rx="4" fill="#efe9fb"/>
        <rect x="208" y="180" width="102" height="30" rx="15" fill="#7a5fd0"/>
        <text x="222" y="200" font-size="11.5" font-weight="600" fill="#ffffff">Customize</text>
      </g>

      <!-- second person, considering the panel -->
      <g transform="translate(1600,280)">
        <rect x="-10" y="80" width="130" height="140" rx="28" fill="#2fae79"/>
        <circle cx="50" cy="42" r="44" fill="#1f7a52"/>
        <rect x="20" y="78" width="26" height="34" rx="10" fill="#1f7a52" transform="rotate(-30 20 78)"/>
      </g>
    </g>
  </g>
</svg>
