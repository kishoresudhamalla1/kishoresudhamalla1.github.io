<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <!--
      GitHub Pages has no server-side router, so it serves this file for any
      unknown path (i.e. any client-side route). It re-encodes the path into
      a query string and redirects to index.html, which decodes it back
      (see the inline script in index.html) so React Router can take over.

      pathSegmentsToKeep:
        0 -> custom domain or a user/organization root page (default here)
        1 -> project page served at https://<user>.github.io/<repo>/
             (change this to 1 if you deploy without a custom domain)
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
